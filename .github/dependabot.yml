version: 2

updates:
  # JavaScript / pnpm — all npm updates in one PR
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    reviewers:
      - "cmwen"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      all-npm:
        patterns:
          - "*"

  # Rust / Cargo — all cargo updates in one PR
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    reviewers:
      - "cmwen"
    labels:
      - "dependencies"
      - "rust"
    groups:
      all-cargo:
        patterns:
          - "*"

  # GitHub Actions — all action updates in one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    reviewers:
      - "cmwen"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-actions:
        patterns:
          - "*"
